[workspace]
resolver = "3"
members = ["apps/core", "services/system", "shell", "tools/vm-manager", "ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true

# Le shell dessine ses panneaux pixel par pixel sur le processeur : sans optimisation, une
# image du lanceur prend plusieurs centaines de millisecondes et le défilement gèle tout.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
