[workspace]
resolver = "3"
members = ["apps/core", "services/portal", "services/system", "services/visage", "shell", "tools/vm-manager", "ui"]

# winit 0.30 ne transmet pas le pincement du pavé tactile sous Wayland : copie retouchée
# (voir third_party/winit/FERRITE.md).
[patch.crates-io]
winit = { path = "third_party/winit" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true

# Le shell dessine ses panneaux pixel par pixel sur le processeur : sans optimisation, une
# image du lanceur prend plusieurs centaines de millisecondes et le défilement gèle tout.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
