[package]
name = "ferrite-apps"
description = "Applications de base Ferrite : fichiers, texte et calculatrice"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true

[[bin]]
name = "ferrite-apps"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
ferrite-ui = { path = "../../ui" }
resvg = { version = "0.49", default-features = false }

[lints]
workspace = true
