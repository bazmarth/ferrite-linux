[package]
name = "ferrite-apps"
description = "Applications de base Ferrite : fichiers, texte, vidéo, calculatrice, paramètres et moniteur"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true

[[bin]]
name = "ferrite-apps"
path = "src/main.rs"

[dependencies]
alacritty_terminal = "0.26"
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
# Seulement pour sa fonction `color_fonts` : emoji en couleur (Noto Color Emoji).
epaint = { version = "0.37", default-features = false, features = ["color_fonts"] }
ferrite-system = { path = "../../services/system" }
ferrite-ui = { path = "../../ui" }
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
# Logithèque : catalogue Flathub (`appstream.xml[.gz]`) et catalogue Debian (DEP-11 en YAML).
flate2 = "1"
quick-xml = "0.41"
yaml-rust2 = "0.13"
# Compression zlib des images PNG mises en PDF (Fichiers › Créer un PDF) ; déjà tirée par png.
miniz_oxide = "0.8"
png = "0.18"
qrcode = { version = "0.14.1", default-features = false }
resvg = { version = "0.49", default-features = false, features = ["text", "system-fonts"] }
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "alac"] }
tracing = "0.1"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[lints]
workspace = true
