[package]
name = "ferrite-apps"
description = "Applications de base Ferrite : fichiers, texte, calculatrice, paramètres et moniteur"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true

[[bin]]
name = "ferrite-apps"
path = "src/main.rs"

[dependencies]
alacritty_terminal = "0.26"
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
ferrite-system = { path = "../../services/system" }
ferrite-ui = { path = "../../ui" }
png = "0.18"
resvg = { version = "0.49", default-features = false }
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "alac"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[lints]
workspace = true
