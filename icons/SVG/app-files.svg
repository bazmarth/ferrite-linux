<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 100 100" role="img" aria-label="Fichiers">
<defs>
 <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feGaussianBlur stdDeviation="1.2"/></filter>
 <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="0.9"/></filter>
 <linearGradient id="back" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3D86E6"/><stop offset="1" stop-color="#1E5FC0"/></linearGradient>
 <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7CC0FF"/><stop offset="1" stop-color="#2C78DE"/></linearGradient>
</defs>
<g transform="translate(-12.1 -14.5) scale(2.3)">
 <!-- Ombre portée du dossier, sans fond derrière -->
 <rect x="8" y="14.5" width="38" height="30.5" rx="3.6" fill="#000" opacity="0.22" filter="url(#shadow)"/>
 <!-- Dos et onglet du dossier -->
 <path d="M10.5 12.5 h9.2 a2.4 2.4 0 0 1 1.8 0.8 l2.2 2.4 h14.8 a3 3 0 0 1 3 3 v4.3 h-34 v-7.5 a3 3 0 0 1 3 -3 z" fill="url(#back)"/>
 <rect x="7.5" y="16" width="39" height="27.5" rx="3.6" fill="url(#back)"/>
 <!-- Feuilles qui dépassent, chacune avec son étiquette de couleur -->
 <g transform="rotate(-7 21 24)">
  <rect x="11.5" y="13.5" width="18" height="21" rx="1.8" fill="#FFFFFF"/>
  <rect x="13.5" y="16" width="7" height="2.6" rx="1" fill="#E03131"/>
  <rect x="13.5" y="20.5" width="12" height="1.1" rx="0.55" fill="#D3D9E2"/>
 </g>
 <g transform="rotate(5 33 24)">
  <rect x="24" y="13" width="18" height="21" rx="1.8" fill="#FFFFFF"/>
  <rect x="33.5" y="15.5" width="6.5" height="2.6" rx="1" fill="#2F9E44"/>
  <rect x="36.8" y="20" width="3.2" height="1.1" rx="0.55" fill="#D3D9E2"/>
 </g>
 <g>
  <rect x="17.5" y="11" width="19" height="22" rx="1.8" fill="#FFFFFF" stroke="#000" stroke-opacity="0.08" stroke-width="0.4"/>
  <rect x="19.6" y="13.6" width="7.4" height="2.8" rx="1" fill="#E67700"/>
  <rect x="19.6" y="18.4" width="13" height="1.1" rx="0.55" fill="#D3D9E2"/>
  <rect x="19.6" y="21" width="10" height="1.1" rx="0.55" fill="#D3D9E2"/>
 </g>
 <!-- Devant du dossier, ombre douce et reflet -->
 <rect x="7.5" y="23.5" width="39" height="20.5" rx="3.6" fill="#0B3A80" opacity="0.28" filter="url(#soft)"/>
 <rect x="7.5" y="22.5" width="39" height="21" rx="3.6" fill="url(#front)"/>
 <path d="M11.1 22.5 h31.8 a3.6 3.6 0 0 1 3.6 3.6 v0.9 h-39 v-0.9 a3.6 3.6 0 0 1 3.6 -3.6 z" fill="#FFFFFF" opacity="0.3"/>
 <rect x="22" y="35.5" width="10" height="1.6" rx="0.8" fill="#0B3A80" opacity="0.28"/>
 </g>
</svg>
