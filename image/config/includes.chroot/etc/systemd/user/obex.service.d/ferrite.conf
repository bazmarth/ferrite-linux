# Ferrite : obexd sans les modules carnet d'adresses (pbap, irmc).
# Sans evolution-data-server, ces modules font un appel qui laisse passer l'apparition
# de BlueZ trop tôt : obexd n'inscrit alors aucun de ses services, et un téléphone ne
# peut plus envoyer de fichier au PC (pas de profil Object Push annoncé).
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/obexd -P pbap,irmc
