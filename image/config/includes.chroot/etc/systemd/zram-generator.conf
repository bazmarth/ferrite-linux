# Échange compressé en mémoire (zram), prioritaire sur l'échange du disque. Sur un SSD lent,
# la mémoire du bureau envoyée sur le disque pendant une grosse tâche (compilation) se
# relisait en plusieurs secondes : l'écran restait figé jusqu'à 35 s. L'échange du disque
# reste en secours, une fois zram plein.
[zram0]
zram-size = ram / 2
compression-algorithm = zstd
swap-priority = 100
