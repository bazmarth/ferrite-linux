[package]
name = "ferrite-shell"
description = "Compositeur Wayland et bureau de Ferrite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
ferrite-system = { path = "../services/system" }
ferrite-ui = { path = "../ui" }
bitflags = "2"
fontdue = "0.9"
libc = "0.2"
png = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
resvg = { version = "0.49.0", default-features = false }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[dependencies.smithay]
version = "0.7"
default-features = false
features = [
    "backend_drm",
    "backend_egl",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_winit",
    "desktop",
    "renderer_gl",
    "use_system_lib",
    "wayland_frontend",
    "xwayland",
]

[lints]
workspace = true
